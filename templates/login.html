<!DOCTYPE html>
<html>
  <head>
    <title>Login Page</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css')}}"
    />
  </head>
  <body id="login">
    <div class="back">
      <input type="button" value="Back" onclick="history.back()" />
    </div>
    <form id="loginForm" action="/login" method="POST">
      <h1 style="color: #36454f">Login</h1>
      {% if success_message %}
      <p class="message" id="success_message">{{ success_message }}</p>
      {% endif %} {% if message %}
      <p class="message" id="error_message">{{ message }}</p>
      {% endif %}
      <label for="username">Username</label>
      <input
        type="text"
        class="lineTextField"
        id="username"
        name="username"
        placeholder="Enter username"
      />
      <label for="password">Password</label>
      <input
        type="password"
        class="lineTextField"
        id="password"
        name="password"
        placeholder="Enter password"
      />
      <input type="submit" value="Login" />
      <p></p>
      <input
        type="button"
        value="Create Account"
        onclick="location.href='/register-page'"
      />
    </form>
  </body>
</html>
